name: Main Branch CI

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  GOWORK: off

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.25'
          cache: true

      - name: Run go vet
        run: go vet ./...

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Run full test suite
        run: go test -v -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        with:
          file: ./coverage.out
          fail_ci_if_error: false

  race:
    name: Race Detector
    runs-on: ubuntu-latest
    env:
      SKIP_RACE_FLAKY: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.25'
          cache: true

      - name: Run race detector
        run: go test -race -timeout=5m ./...

  benchmark:
    name: Benchmark Regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.25'
          cache: true

      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@latest

      - name: Run benchmarks
        run: |
          go test -bench=. -benchmem -count=5 ./... | tee current-bench.txt

      - name: Compare with baseline
        run: |
          if [ -f .benchmarks/baseline.txt ]; then
            echo "Comparing benchmarks..."
            benchstat .benchmarks/baseline.txt current-bench.txt > comparison.txt || true
            cat comparison.txt

            if grep -E "\+[0-9]+\.[0-9]+%" comparison.txt; then
              echo "::warning::Performance regression detected"
              regression=$(grep -Eo "\+[0-9]+\.[0-9]+%" comparison.txt | head -1 | tr -d '+%')
              if (( $(echo "$regression > 5.0" | bc -l) )); then
                echo "::error::Regression exceeds 5% threshold: $regression%"
                exit 1
              fi
            fi
          else
            echo "No baseline found, creating initial baseline"
          fi

      - name: Upload benchmark results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: benchmark-results
          path: |
            current-bench.txt
            comparison.txt

  vuln:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.25'
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...
